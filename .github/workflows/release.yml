name: release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Set release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          mvn --batch-mode versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
      - name: Verify and package
        run: mvn --batch-mode clean verify
      - name: Smoke test packaged CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-test.sh "target/agent-framework-$version.jar"
      - name: Publish Maven package
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          (
            cd target
            sha256sum "agent-framework-$version.jar" > "agent-framework-$version.jar.sha256"
          )
      - name: Publish GitHub release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "target/agent-framework-$version.jar" \
            "target/agent-framework-$version.jar.sha256" \
            --verify-tag --generate-notes --title "Agent Framework $version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
